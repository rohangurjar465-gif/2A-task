<!DOCTYPE html>
<html>
<head>
    <title>Glassmorphism Login</title>

    <style>

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(to right, rgb(26, 26, 88), rgb(120, 16, 47));
        }

        .card{
            width:300px;
            padding:30px;
            background:rgba(255, 255, 255, 0.2);
            border-radius:15px;
            box-shadow:0 4px 10px rgb(43, 16, 16);
            text-align:center;
            color:white;
         
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
            border:none;
            border-radius:5px;
            font-weight: bold;
        }

        button{
            padding:10px 20px;
            border:none;
            border-radius:5px;
            background:white;
            font-weight: bold;
                cursor: pointer;
        }

    </style>
</head>

<body>

    <div class="card">

        <h2>Login</h2>

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button>Login</button>

    </div>

</body>
</html>
