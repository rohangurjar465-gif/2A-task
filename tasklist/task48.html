<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prime number</title>
    <!-- prime num khudse hot hai y ak se bs  -->
</head>
<body>
    <input type="text" id="input" placeholder="enter number">
    <button id="btn">click</button>
    <h3 id="result"></h3>
    <script>
    let number=document.querySelector("#input");
    let btn=document.querySelector("#btn");
    let rslt=document.querySelector("#result");
    btn.addEventListener("click",()=>{
      num = Number(input.value);
      let prime =true;
       for(let i=2;i<num;i++){

        if(num%i==0){

            prime=false;

            break;

        }
        
    }

    if (prime) {
        rslt.innerHTML="prime";
    }
    else{
      rslt.innerHTML="not prime "
    }
    });
    </script>
    
</body>
</html>
