<!DOCTYPE html>
<html>
<head>
    <title>Event Registration Form</title>
</head>
<body>

<h1>Event Registration</h1>

<form>

    <!-- Name -->
    <label>Name:</label>
    <input 
        type="text"
        required>

    <br><br>

    <!-- Email -->
    <label>Email:</label>
    <input 
        type="email"
        required>

    <br><br>

    <!-- Phone -->
    <label>Phone:</label>
    <input 
        type="text"
        pattern="[0-9]{10}"
        required>

    <br><br>

    <!-- Age -->
    <label>Age:</label>
    <input 
        type="number"
        required>

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

</body>
</html>
