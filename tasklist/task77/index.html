    let buttons = document.querySelectorAll('.filtres');
    let cards = document.querySelectorAll('.card1');

    });
    buttons.forEach(button => {
        button.addEventListener('click', () => {
            let cat = button.getAttribute('data-cat');
            cards.forEach(card => {
                if (cat === 'all') {
                    card.style.display = 'block';
                } else {
                    if (card.getAttribute('data-cat') === cat) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                }
            });
        });
    });
