<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <input type="text" id="input" placeholder="enter value ">
   <button id="btn">click to count value length</button>
   <h3 id="result"></h3>
   <script>
    let number=document.querySelector("#input");
    let btn=document.querySelector("#btn");
    let rslt=document.querySelector("#result");
    btn.addEventListener("click",()=>{
        let num=number.value.split(" ");
        num=num.map(Number);
        for (let sum = 0; sum <= num.length; sum++) {
          const element = sum;
          rslt.innerHTML=element;
           
        }
    })
  
   </script>
   
</body>
</html>
