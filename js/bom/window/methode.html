
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<button onclick="openWindow()">Open Window</button>
<button onclick="closeWindow()">Close Window</button>
<button onclick="moveWin()">moveto</button>
<button onclick="moveby()">moveby</button>
<button onclick="resizeto()">RESIzTO</button>
<button onclick="resizeBy()">RESIzby</button>

<script>
let myWin; // global variable

let inhight = window.innerHeight;
let othight = window.outerHeight;

console.log("inner height: " + inhight);
console.log("outer height: " + othight);


let iwidth = window.innerWidth;
let owidth = window.outerWidth;

console.log("inner w: " +  iwidth);
console.log("outer w: " +  owidth);

// open
function openWindow(){
    myWin = window.open("", "", "width=300,height=300"); //url name-_parent''' spech-hight y sb
  myWin.document.write("demo window");
}

// close
function closeWindow(){
    if(myWin){
        myWin.close();
    }
}

// move
function moveWin(){
    if(myWin){
        myWin.moveTo(200,200);
    }
}
function moveby() {
    if(myWin){
        myWin.moveBy(100,100);
    }
}
function resizeto(){
    if(myWin){
        myWin.resizeTo(300,300);
    }
}
function resizeBy(){
    if(myWin){
myWin.resizeBy(100,100);

    }
}
</script>

</body>
</html>
