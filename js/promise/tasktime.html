    <script>
        // setInterval(function, delay, param1, param2, ...)

        let mytask=(tasknum,time)=>{
               return new Promise((resolve, reject) => {
                  setTimeout(()=>{
                    console.log("task", tasknum);
                    resolve();
                    
                  },time)
               })
        }

        mytask(1,1000)
        .then((r)=>mytask(2,2000))
        .then((re)=>mytask(3,1000))
        .then((res)=>mytask(4,1000));
    </script>
