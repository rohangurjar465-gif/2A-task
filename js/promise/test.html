<body>
    <button onclick="btn()">login</button>
</body>
<script>
    function btn(){
    let pass=prompt("enter your password");
    let promise=new Promise((resolve,reject)=>{
       
        if (pass=="12345") {
          resolve("resolve right password");
            
        } else {
            reject("wrong password");
            
        } 
         });   
promise
.then((res) =>{
    console.log(res);
})
.catch((err) =>{
    console.log(err);
});
   
}

</script>
