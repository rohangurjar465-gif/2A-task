<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <script>
let mysub = (subject) => {
    return new Promise((resolve) => {
        setTimeout(() => {
            resolve(`${subject} subject done`);
        }, 2000);
    });
}

let myfun = async () => {
    let res = await mysub("math"); 
    console.log(res);

    console.log("hello");
}

myfun();
</script>
</body>
</html>
