<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
          *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: Arial, sans-serif;
          }
          
          html,body{
          height: 100%;
          width: 100%;
          }

          .model{
            height: 300px;
            width: 300px;
            box-shadow: 0px 0px 10px 5px #ccc; 
            transform: translate(160% , 50%);
            text-align: center;
            display: none;
          }
           .model h1 span{
            position: absolute;
            right: 3px;
            cursor: pointer;
           }
          .login-form{
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
gap: 10px;
color: rgb(17, 16, 15);
margin-top: 20px;
font-weight: bold;

}

.login-form input{
padding: 10px;
border: 3px solid #ccc;
}

.login-form button{
padding: 10px;
font-weight: bold;
background: black;
color: white;
/* border: none; */
cursor: pointer;
text-decoration: underline solid rgb(61, 7, 237) ;

}
.login-form button:hover{
    color: rgb(130, 128, 158);
     transition: 0.4s;
    transform: scale(1.01);
}
h1 span:hover{
     color: rgb(25, 13, 186);
     transition: 0.4s;
    transform: scale(1.01);
}
    </style>

<button id="formbtn">show form</button>
   <div class="model">

<h1>Login <span>&times;</span></h1>

<form class="login-form">

<label>User name</label>
<input type="text" placeholder="Enter username">

<label>Password</label>
<input type="password" placeholder="Enter password">

<button type="submit">Login / sing-in</button>

</form>

</div>


</body>

    <script>
     let modell = document.querySelector(".model");
let formbtn = document.querySelector("#formbtn");
let closebtn = document.querySelector(".model span");

formbtn.addEventListener("click" ,()=>{
    modell.style.display = "block";
});


closebtn.addEventListener("click", ()=>{
    modell.style.display = "none";
});

    </script>

</html>
