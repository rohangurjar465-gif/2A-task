 <button id="btn">form </button>
    <DIV class="model">
     <h2>demo form <span id="clik">&times;</span></h2>
    </DIV>

    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        }
        
        html,body{
        height: 100%;
        width: 100%;
        }
        .model{
            width: 350px;
            height: 350px;
            display: none;
            box-shadow: 0px 0px 20px rgb(122, 43, 43);
              position: fixed;
              left: 50%;
              top: 50%;
              transform: translate(-50% ,-50%);
              
            
        }

        .model h2{
            text-align: center;
            position: relative;
            top: 3px;

        }
        #clik{
            position: absolute;
            right:4px;
            cursor: pointer;

            
        }
    </style>


  <script> 
    let btn=document.querySelector("#btn");
    let click=document.querySelector("#clik");
    let model=document.querySelector(".model");
    btn.addEventListener("click", ()=>{
        model.style.display="block";
    });
  click.addEventListener("click",()=>{
    model.style.display="none";
  })

  </script>
