<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="add">add class</button>
   <button id="remove">remove class</button>
   <button id="toggel">Toggel class </button>
   <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Hic, error doloremque. Numquam assumenda sequi exercitationem
     atque nisi soluta. Iusto assumenda asperiores minus maiores inventore autem nemo perferendis facilis dolorum corporis!</p>
    <style>
        .active{
            background-color: yellow;
            font-size: bold;
        }
    </style>
</body>
<script>
    let add=document.querySelector("#add");
    let remove=document.querySelector("#remove");
    let toggel=document.querySelector("#toggel");
    let parra=document.querySelector("p");

    add.addEventListener("click" , ()=>{
        parra.classList.add('active');
    })
    remove.addEventListener("click", ()=>{
        parra.classList.remove('active');
    })
   toggel.addEventListener("click" ,()=>{
    parra.classList.toggle('active');
   })
   

</script>
</html>
