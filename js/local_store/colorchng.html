<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button>red</button>
        <button>black</button>
            <button>yellow</button>



    <script>
       
 let bodyitem=document.querySelector("body");
 let btn=document.querySelectorAll("button");
  
 btn.forEach((bttn)=>{
     bttn.addEventListener("click", ()=>{
       
        localStorage.setItem("colortheme",bttn.innerHTML.toLowerCase());
        colorth();
     });
        


 });

 let colorth=()=>{
   let color=localStorage.getItem("colortheme");
   bodyitem.style.background=color;
 }

colorth();

    </script>
</body>
</html>
