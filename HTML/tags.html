
    <!DOCTYPE html> 
<!-- HTML5 document declare karta hai -->

<html>
<!-- HTML page ka root tag -->

<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <!-- Page ki information yaha hoti hai -->

    <title>My First Page</title>
    <!-- Browser tab me title dikhata hai -->

    <meta charset="UTF-8">
    <!-- Character encoding set karta hai -->

</head>

<body>
    <!-- Page ka visible content yaha hota hai -->

    <h1>Main Heading</h1>
    <!-- Sabse badi heading -->

    <h2>Sub Heading</h2>
    <!-- Choti heading -->

    <p>This is paragraph.</p>
    <!-- Paragraph likhne ke liye -->

    <br>
    <!-- Line break ke liye -->

    <hr>
    <!-- Horizontal line -->

    <b>Bold Text</b>
    <!-- Text bold karta hai -->

    <i>Italic Text</i>
    <!-- Text italic karta hai -->

    <u>Underline Text</u>
    <!-- Text underline karta hai -->

    <strong>Important Text</strong>
    <!-- Important text (bold jaisa) -->

    <em>Emphasized Text</em>
    <!-- Emphasis ke liye -->

    <a href="https://google.com">Go to Google</a>
    <!-- Link banane ke liye -->

    <img src="image.jpg" alt="My Image" width="200">
    <!-- Image show karne ke liye -->

    <ul>
        <!-- Unordered list -->
        <li>Apple</li>
        <li>Mango</li>
    </ul>

    <ol>
        <!-- Ordered list -->
        <li>One</li>
        <li>Two</li>
    </ol>

    <table border="1">
        <!-- Table banane ke liye -->
        <tr>
            <!-- Table row -->
            <th>Name</th>
            <!-- Table heading -->
            <th>Age</th>
        </tr>
        <tr>
            <td>Rohan</td>
            <!-- Table data -->
            <td>22</td>
        </tr>
    </table>

    <input type="text" placeholder="Enter name">
    <!-- Input box -->

    <button>Submit</button>
    <!-- Button -->

    <div>
        <!-- Block container -->
        This is div
    </div>

    <span>
        <!-- Inline container -->
        This is span
    </span>

</body>

</html>

</body>
</html>
