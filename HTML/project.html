<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>USER INFORMATION</h1>

    <form action="eduction.html">

        <!-- Username -->
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" >

        <!-- Password -->
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password">

        <!-- Class Selection -->
        <h2>Select Class</h2>

        <div class="option-group">
            <input type="radio" name="class" value="class 1" id="c1">
            <label for="c1">Class 1</label>
        </div>

        <div class="option-group">
            <input type="radio" name="class" value="class 2" id="c2">
            <label for="c2">Class 2</label>
        </div>

        <div class="option-group">
            <input type="radio" name="class" value="class 3" id="c3">
            <label for="c3">Class 3</label>
        </div>

        <!-- Favourite Subject -->
        <h2>Select Favourite Subject</h2>

        <div class="option-group">
            <input type="checkbox" name="subject" value="math" id="s1">
            <label for="s1">Math</label>
        </div>

       
         <label for="s2">
            <input type="checkbox" name="subject" value="biology" id="s2" > Biology
            
        </label>
   

        <div class="option-group">
            <input type="checkbox" name="subject" value="commerce" id="s3">
            <label for="s3">Commerce</label>
        </div>

        <!-- City -->
        <h2>Select City</h2>
        <select name="city" required>
            <option value="" disabled selected>Select City</option>
            <option value="delhi">Delhi</option>
            <option value="mumbai">Mumbai</option>
            <option value="goa">Goa</option>
        </select>

        <!-- Feedback -->
        <h2>Feedback</h2>
        <textarea name="feedback" rows="4" placeholder="Enter feedback"></textarea>

        <br><br>
        <input type="submit" value="Submit">

    </form>

</body>

</html>
