<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="gues" placeholder="inter number">
    <button id="button">clike</button>
    <h2 id="page"></h2>
    <script>
        let random=Math.floor(Math.random()*4+1);

        let guess=document.querySelector("#gues");
        let btn=document.querySelector("#button");
        let result=document.querySelector("#page");
        
        
        
      btn.addEventListener("click",()=>{
        console.log(random);
        let res=Number(guess.value);
        if (res==random) {
            result.innerHTML="you win";
        } else {
            result.innerHTML="lose";
        }
      });

      
    </script>
</body>
</html>
