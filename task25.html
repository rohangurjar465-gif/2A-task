<!DOCTYPE html>
<html>
<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <h2>Signup Form</h2>

    <form>

        <div class="mb-3">

            <label class="form-label">
                Name
            </label>

            <input
                type="text"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                class="form-control"            
                placeholder="Enter Email"
                required>

        </div>

        <button type="submit" class="btn btn-primary">
            Signup
        </button>

    </form>

</div>

</body>
</html>
