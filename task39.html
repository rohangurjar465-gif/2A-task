<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

   <!-- debounce function -->
    <input type="text" id="serch" placeholder="serch">

  <script>
    let timer
    let serch=document.querySelector("#serch");
    serch.addEventListener("keyup",()=>{
        
      clearTimeout(timer);

       timer= setTimeout(() => {
            console.log("serching..............");
            
        }, 1000);
    });

  </script>
</body>
</html>
