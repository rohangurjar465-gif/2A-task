<body>
    <script>
        let arr=[1,2,3,0,4,0,1,0,5,0];
        let newarr=[];
        let zero=0;
        for (let step = 0; step < arr.length; step++) {
          if (arr[step]==0) {
            zero++;
          }   
          else{
            newarr.push(arr[step]);
          }     
         
        }
          for (let count = 0; count <zero; count++) {
                 newarr.push(0);            
          }   
        console.log(newarr);
        
    </script>
