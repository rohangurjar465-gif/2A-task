<!DOCTYPE html>
<html>
<head>
    <title>Grid Dashboard</title>

<style>

.container{
    display:grid;

    grid-template-columns:repeat(5,4fr);

    /* grid-template-rows:100px 100px; */

    gap:10px;
}

.box{
    background:rgb(91, 100, 103);
    padding:30px;
    text-align:center;
    font-size:20px;
}

</style>
</head>

<body>

<div class="container">

    <div class="box">Dashboard</div>
    <div class="box">Profile</div>
    <div class="box">Settings</div>

    <div class="box">Users</div>
    <div class="box">Reports</div>
    <div class="box">Messages</div>
        <div class="box">Messages</div>


</div>

</body>
</html>
