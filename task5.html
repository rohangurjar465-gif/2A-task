<!DOCTYPE html>
<html>
<head>
    <title>Nature Gallery</title>

    <style>
        .gallery{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

        img{
            width:250px;
            height:180px;
            border-radius:10px;
        }
    </style>
</head>
<body>

    <h1>Nature Photo Gallery</h1>

    <div class="gallery">

        <img 
        src="nature1.jpg" 
        alt="Beautiful green mountains with river">

        <img 
        src="nature2.jpg" 
        alt="Sunset view at the beach">

        <img 
        src="nature3.jpg" 
        alt="Forest with tall trees and sunlight">

    </div>

</body>
</html>
