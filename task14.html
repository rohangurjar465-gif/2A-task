<!DOCTYPE html>
<html>
<head>
    <title>Pricing Cards</title>

    <style>

        .container{
            display:flex;
            gap:20px;
            /* flex-direction: column; */
            justify-content:center;
            margin-top:50px;
        }

        .card{
            width:200px;
            padding:20px;
            background:lightgray;
            text-align:center;
            border-radius:10px;
        }

        button{
            padding:10px;
            background:rgb(84, 84, 148);
            color:white;
            border:none;
            cursor: pointer;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">
        <h2>Basic</h2>
        <h3>₹199</h3>
        <p>1 Website</p>
        <button>Buy</button>
    </div>

    <div class="card">
        <h2>Standard</h2>
        <h3>₹499</h3>
        <p>5 Websites</p>
        <button>Buy</button>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <h3>₹999</h3>
        <p>Unlimited Websites</p>
        <button>Buy</button>
    </div>

</div>

</body>
</html>
