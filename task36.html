<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <style>
        *{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: Arial, sans-serif;
}

body{
height: 100%;
width: 100%;
background-color: rgb(157, 157, 152);
}

.main{
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;


}

.btn{
  width: 220px;
  background-color: rgb(44, 38, 40);
  padding: 10px;
  display: grid;
  gap: 10px;
  box-shadow: 0px 0px 20px 3px rgb(18, 7, 11);

}

input{
  grid-column: span 4;
  padding: 10px;
}
.btn input{
  height: 50px;
  width: 200px;
  color: aliceblue;
  font-size: large;
  background-color: rgb(48, 45, 46);
    font-weight: bolder;
  
 
}

button{
  padding: 10px;
  font-weight: bolder;
  color: rgb(236, 236, 242);
  background-color: rgb(67, 63, 60);
  cursor: pointer;
  font-size:medium;
  border-radius: 30%;
   transition: all 0.6s ease-out;
     border: 2px solid rgb(129, 122, 122);
     
  
     
}
#yellow{
  background-color: rgb(239, 145, 23);
}
#green{
  background-color: rgb(93, 24, 19);
}

 button:hover{
    background-color: rgb(127, 120, 120);
  }


    </style>
<body>
  
    <div class="main">
        
<div class="btn">
<input type="text" id="d">

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('+')">+</button>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('-')">-</button>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('/')">/</button>
<button onclick="add('0')">0</button>
<button onclick="clr()" id="green">C</button>
<button onclick="result()" id="yellow">=</button>

<button onclick="add('*')">*</button>



</div>

</div>
<script>
    let d = document.getElementById("d");

function add(v){
d.value += v;
}

function result(){
d.value = eval(d.value);
}

function clr(){
d.value = "";
}
</script>

</body>
</html>
