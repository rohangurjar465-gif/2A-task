<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Modal</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Product Store</h1>

<select id="sort">
    <option value="">Sort Products</option>
    <option value="low">Price Low to High</option>
    <option value="high">Price High to Low</option>
</select>

<div class="products">

    <!-- Laptop 1 -->
    <div class="card">
        <img src="mackbook.jpg" alt="">
        <h3>MacBook Air M2</h3>
        <p class="price">₹90000</p>
        <button class="details">View Details</button>
    </div>

    <!-- Laptop 2 -->
    <div class="card">
        <img src="mackbook.jpg" alt="">
        <h3>HP Pavilion</h3>
        <p class="price">₹65000</p>
        <button class="details">View Details</button>
    </div>

    <!-- Laptop 3 -->
    <div class="card">
        <img src="mackbook.jpg" alt="">
        <h3>Dell Inspiron</h3>
        <p class="price">₹72000</p>
        <button class="details">View Details</button>
    </div>

    <!-- Laptop 4 -->
    <div class="card">
        <img src="mackbook.jpg" alt="">
        <h3>Lenovo IdeaPad</h3>
        <p class="price">₹58000</p>
        <button class="details">View Details</button>
    </div>

    <!-- Phone 1 -->
    <div class="card">
        <img src="mobile.jpg" alt="">
        <h3>iPhone 15</h3>
        <p class="price">₹79999</p>
        <button class="details">View Details</button>
    </div>

    <!-- Phone 2 -->
    <div class="card">
        <img src="mobile.jpg" alt="">
        <h3>Samsung S25</h3>
        <p class="price">₹74999</p>
        <button class="details">View Details</button>
    </div>

    <!-- Phone 3 -->
    <div class="card">
        <img src="mobile.jpg" alt="">
        <h3>OnePlus 13</h3>
        <p class="price">₹54999</p>
        <button class="details">View Details</button>
    </div>

    <!-- Phone 4 -->
    <div class="card">
        <img src="mobile.jpg" alt="">
        <h3>Realme GT</h3>
        <p class="price">₹39999</p>
        <button class="details">View Details</button>
    </div>

</div>

<!-- Modal -->

<div class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <img id="modalImg" src="" alt="">

        <h2 id="modalTitle"></h2>

        <p id="modalPrice"></p>

        <button>Buy Now</button>

    </div>

</div>

<script src="js.js"></script>

</body>
</html>
